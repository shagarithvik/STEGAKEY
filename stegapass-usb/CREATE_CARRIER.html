<!DOCTYPE html>
<html>
<head>
    <title>Create Carrier PNG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
        }
        canvas {
            border: 2px solid #ccc;
            margin: 10px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>StegaPass Carrier PNG Generator</h2>
    <p>Create a carrier PNG file for your USB drive. This is a placeholder image that will be scanned for hidden data.</p>
    
    <div>
        <label>
            Image Width: <input type="number" id="width" value="800" min="100" max="4000">
        </label>
        <label>
            Height: <input type="number" id="height" value="600" min="100" max="4000">
        </label>
    </div>
    
    <button onclick="generateImage()">Generate Carrier Image</button>
    <button onclick="useExistingImage()">Upload Existing Image</button>
    
    <div id="canvasContainer"></div>
    <div id="result"></div>
    
    <script>
        function generateImage() {
            const width = parseInt(document.getElementById('width').value);
            const height = parseInt(document.getElementById('height').value);
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // Create a gradient background
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#4a90e2');
            gradient.addColorStop(1, '#50c8e0');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Add some text
            ctx.fillStyle = 'white';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('StegaPass Carrier', width/2, height/2 - 20);
            ctx.font = '16px Arial';
            ctx.fillText('This PNG contains hidden encrypted data', width/2, height/2 + 20);
            
            document.getElementById('canvasContainer').innerHTML = '';
            document.getElementById('canvasContainer').appendChild(canvas);
            
            // Download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'carrier.png';
                a.click();
                URL.revokeObjectURL(url);
                
                document.getElementById('result').innerHTML = 
                    '<div style="background: #d4edda; padding: 10px; border-radius: 5px; color: #155724;">' +
                    '✓ Carrier PNG generated and downloaded!<br>' +
                    'Rename it to carrier.png and place it in your USB root folder.' +
                    '</div>';
            });
        }
        
        function useExistingImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/png';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    // Just copy the file as carrier.png
                    const url = URL.createObjectURL(file);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'carrier.png';
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    document.getElementById('result').innerHTML = 
                        '<div style="background: #d4edda; padding: 10px; border-radius: 5px; color: #155724;">' +
                        '✓ Carrier PNG downloaded!<br>' +
                        'Place it in your USB root folder.' +
                        '</div>';
                }
            };
            input.click();
        }
    </script>
</body>
</html>
